<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Talk Show Flash Player</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000000; overflow: hidden; }
        #flash-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    </style>
    
    <!-- 1. PLACED RIGHT HERE INSIDE THE HEAD TAG -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
    <div id="flash-container"></div>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            document.getElementById("flash-container").appendChild(player);
            
            // Adjust player dimensions to fit your SWF size
            player.style.width = "640px";  
            player.style.height = "480px"; 
            
            player.config = { autoplay: "on", allowScriptAccess: true };
            player.load("talkshow.swf"); 
        });
    </script>
</body>
</html>
